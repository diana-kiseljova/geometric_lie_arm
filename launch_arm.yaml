# Запуск управления роборукой Panda в MuJoCo.
#
#   conda activate <name_of_env>
#   python launch_arm.py -a launch_arm.yaml
#
# Контроллер (arm_*) → задача (Task) → MuJoCo-сцена (scene.xml).


##############################################################################################################
#                                              Сцена и время                                                 #
##############################################################################################################

#  18.0
#  9.0
T: 9.0
realtime: true        # значит симуляция должна визуально длиться примерно T реальных секунд
viewer: true          # открыть mujoco.viewer.launch_passive (рисовать симуляцию)

##############################################################################################################
#                                            Контроллер                                                      #
##############################################################################################################

#  arm_joint_pd       — простая интерполяция к q_target (управляет напрямую углами суставов)
#  arm_jacobian_ik    — DLS IK на 6D ошибку EE (EE = End Effector — концевой эффектор робота)
#  arm_osc            — Cartesian PD + nullspace posture (Nullspace — это такие движения суставов, которые почти не меняют end-effector)
#  arm_se3_pid        — PID в стиле pid_v1 на ψ = Log(X_d^{-1} X_ee), проекция J_b^#
#  arm_se3_lqr        — LTI LQR в стиле lqr_v3 на [ψ; ψ̇] ∈ R^12, проекция J_b^#
controller_name: arm_se3_pid

# Опциональные оверрайды параметров контроллера из src/config/arm_control.py
controller_overrides: {}


##############################################################################################################
#                                               Задача                                                       #
##############################################################################################################

#  hold_home          — держать домашнюю позу
#  reach_pose         — достичь и удерживать одну EE-позу (EE = End Effector — концевой эффектор робота)
#  ee_line            — двигать EE между двумя точками
#  pick_and_place     — взять куб и переставить
task_name: pick_and_place

# kwargs, передаваемые в конструктор задачи.  Пример для каждой:
#
# reach_pose:
#   pos:  [0.5, 0.0, 0.4]
#   quat: [0.0, 1.0, 0.0, 0.0]
#
# ee_line:
#   p_a:    [0.5, -0.2, 0.4]
#   p_b:    [0.5,  0.2, 0.4]
#   period: 6.0
#
# pick_and_place:
#   cube_init_pos: [0.60, 0.25, 0.035]
#   place_xy:      [0.30, -0.25]
task_kwargs: {}


##############################################################################################################
#                                                I/O                                                         #
##############################################################################################################

save_root_path: arm_runs
extra_info: ""
